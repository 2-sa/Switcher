name: Verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Build, sign, and publish a new fork release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Check, test, and build Windows
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      release-tag: ${{ steps.release-version.outputs.tag }}
      release-version: ${{ steps.release-version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    env:
      WAILS3_VERSION: v3.0.0-beta.16
      CGO_ENABLED: '0'
    steps:
      - name: Configure canonical temporary paths
        # Native path checks must not receive the profile's RUNNER~1 alias.
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare fork release version
        id: release-version
        if: github.repository == '2-sa/Switcher' && github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/master'
        env:
          RELEASE_VERSION: 4.1.${{ github.run_number }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          .\other\github-release.ps1 -Step PrepareVersion -ReleaseTag $tag
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$env:RELEASE_VERSION" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm and Wails
        run: |
          npm install -g pnpm@11.0.8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$env:WAILS3_VERSION"

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Generate Wails bindings
        run: wails3 generate bindings -f "-tags production,devtools" -clean=true -ts

      - name: Check Svelte and TypeScript
        run: pnpm --dir frontend run check

      - name: Test frontend
        run: pnpm --dir frontend run test

      - name: Build frontend
        run: pnpm --dir frontend run build
        env:
          PRODUCTION: 'true'

      - name: Test Go
        run: go test ./...

      - name: Build Windows application
        run: wails3 task windows:build

      - name: Build and test BearSwitcher installer
        if: github.event_name == 'workflow_dispatch'
        run: |
          choco upgrade nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed on the build runner.' }
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /VERSION
          $displayVersion = if ($env:APP_VERSION) { $env:APP_VERSION } else { '0.0.0' }
          $fileVersion = if ($env:NSIS_VERSION) { $env:NSIS_VERSION } else { '0.0.0.0' }
          .\other\build-fork-installer.ps1 -Version $displayVersion -FileVersion $fileVersion
          .\other\test-fork-installer.ps1 -Version $displayVersion

      - name: Sign and verify fork update
        if: steps.release-version.outputs.tag != ''
        env:
          FORK_UPDATER_KEY: ${{ secrets.FORK_UPDATER_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FORK_UPDATER_KEY)) {
            throw 'Missing FORK_UPDATER_KEY repository secret.'
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'fork-updater-key.pem'
          try {
            [System.IO.File]::WriteAllText($keyPath, $env:FORK_UPDATER_KEY, [System.Text.UTF8Encoding]::new($false))
            $checksums = foreach ($name in @('TcNo-Acc-Switcher.exe', 'BearSwitcher-Setup.exe')) {
              $file = Join-Path bin $name
              $signature = go run ./other/sign-release $keyPath $file
              if ($LASTEXITCODE -ne 0) { throw "Signing failed: $name" }
              Set-Content "$file.sig" -Value $signature -Encoding utf8NoBOM
              go run ./other/verify-release updater-key.pub $file "$file.sig" | Out-Host
              if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $name" }
              "$((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant())  $name"
            }
            Set-Content bin/SHA256SUMS -Value $checksums -Encoding utf8NoBOM
          } finally {
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
          }

      - name: Upload verified release files
        if: steps.release-version.outputs.tag != ''
        uses: actions/upload-artifact@v7
        with:
          name: fork-release
          path: |
            bin/BearSwitcher-Setup.exe
            bin/BearSwitcher-Setup.exe.sig
            bin/TcNo-Acc-Switcher.exe
            bin/TcNo-Acc-Switcher.exe.sig
            bin/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

      - name: Upload unsigned test build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: switcher-windows-unsigned
          path: bin/TcNo-Acc-Switcher.exe
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish fork release
    needs: windows
    if: github.repository == '2-sa/Switcher' && github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release files
        uses: actions/download-artifact@v8
        with:
          name: fork-release
          path: release

      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.windows.outputs.release-tag }}
          RELEASE_VERSION: ${{ needs.windows.outputs.release-version }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > draft-state.txt; then
            actual_commit="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')"
            test "$actual_commit" = "$SOURCE_COMMIT"
            if grep -qx false draft-state.txt; then
              echo "Release $RELEASE_TAG is already published."
              exit 0
            fi
          else
            cat > release-notes.md <<EOF
          Windows x64 build from commit $SOURCE_COMMIT.

          ## Install BearSwitcher

          Download [BearSwitcher-Setup.exe](https://github.com/2-sa/Switcher/releases/download/$RELEASE_TAG/BearSwitcher-Setup.exe) and follow the installation wizard. The installer supports Arabic and English, adds Start menu shortcuts and Windows uninstall registration, and preserves existing account data.

          The separate TcNo-Acc-Switcher.exe asset is the payload used by the in-app updater. Use BearSwitcher-Setup.exe for installation.

          Update authenticity is protected by an Ed25519 signature, verified before publication. The executable does not have a Windows Authenticode certificate.

          Builds made before the fork signing key was introduced require one manual download of this version. Later versions can update through the application.
          EOF
            gh release create "$RELEASE_TAG" --target "$SOURCE_COMMIT" --draft --title "BearSwitcher $RELEASE_VERSION" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" BearSwitcher-Setup.exe BearSwitcher-Setup.exe.sig TcNo-Acc-Switcher.exe TcNo-Acc-Switcher.exe.sig SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false
          release_id="$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '.id')"
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" -f make_latest=legacy > /dev/null
